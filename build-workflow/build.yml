name: combinewrt build (stub)
run-name: combinewrt-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      artifact_name:
        required: true
      profile:
        required: true
      image_type:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stub build
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PROFILE: ${{ inputs.profile }}
          IMAGE_TYPE: ${{ inputs.image_type }}
        run: |
          echo "combinewrt stub build"
          echo "build_id=$BUILD_ID"
          echo "profile=$PROFILE"
          echo "image_type=$IMAGE_TYPE"
          sleep 5
          mkdir -p out
          echo "dummy artifact for $BUILD_ID" > out/dummy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out/
