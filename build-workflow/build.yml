name: combinewrt build (stub)
run-name: combinewrt-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        required: true
      artifact_name:
        required: true
      profile:
        required: true
      image_type:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stub build
        run: |
          echo "combinewrt stub build"
          echo "build_id=${{ inputs.build_id }}"
          echo "profile=${{ inputs.profile }}"
          echo "image_type=${{ inputs.image_type }}"
          sleep 5
          mkdir -p out
          echo "dummy artifact for ${{ inputs.build_id }}" > out/dummy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out/
