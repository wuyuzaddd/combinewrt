# Source-build a kernel line for combinewrt V2.
#
# Canonical copy: build-workflow/source-build.yml in the combinewrt site repo.
# Keep this file byte-identical with that copy.
#
# The payload is a SourceRecipe produced by src/lib/build/source.ts. It carries
# the exact .config, pinned feeds.conf, package list and image expectations, so
# this workflow never invents build input: it only checks out the pinned source,
# applies the recipe and packages what came out. Both triggers exist for the
# transition period: workflow_dispatch while the workflow lives on a topic
# branch, repository_dispatch once it is on the default branch.
name: source-build

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "SourceRecipe JSON produced by src/lib/build/source.ts"
        required: true
        type: string
      build_id:
        description: "Build id used for the run name and the concurrency group (optional)"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [combinewrt-source-build]

permissions:
  contents: read

# Ticket 13: one live source-build run per build id. The site's queue already
# caps concurrency; this group makes a duplicate dispatch of the same build wait
# rather than run the recipe twice. cancel-in-progress stays false so a retry
# cannot kill a source tree that has been compiling for hours.
concurrency:
  group: source-build-${{ github.event.client_payload.buildId || inputs.build_id || github.run_id }}
  cancel-in-progress: false

run-name: source-build-${{ github.event.client_payload.buildId || inputs.build_id || github.run_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v7

      - name: Prepare recipe
        env:
          RECIPE_INPUT: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh

          if [ -n "${RECIPE_INPUT:-}" ]; then
            printf '%s' "$RECIPE_INPUT" > plan.json
          elif jq -e '.client_payload | type == "object"' "$GITHUB_EVENT_PATH" > /dev/null; then
            jq '.client_payload' "$GITHUB_EVENT_PATH" > plan.json
          elif [ -f .github/source-build-plan.json ]; then
            jq '.' .github/source-build-plan.json > plan.json
          else
            fail prepare "" "" "" "No source-build recipe in the dispatch payload or .github/source-build-plan.json."
          fi

          # A repository_dispatch payload nests the whole recipe under
          # `composition` (client_payload has a ten top-level property limit,
          # spec:108); a workflow_dispatch input or the checked-in plan file
          # carries it flat. Normalise both to the flat recipe we build from.
          if jq -e '.composition | type == "object"' plan.json > /dev/null; then
            jq -c '.composition + {buildId: (.buildId // "")}' plan.json > plan.normalised.json
            mv plan.normalised.json plan.json
          fi

          if ! jq -e '
            .schemaVersion == 1 and
            .engine == "source" and
            (.config | type == "string") and
            (.feedsConf | type == "string") and
            (.packages | type == "array") and
            (.configChecks | type == "array" and length > 0) and
            (.profileChecks | type == "array" and length > 0) and
            (.source.repo | type == "string" and startswith("https://github.com/")) and
            (.source.ref | type == "string" and test("^[0-9a-f]{40}$")) and
            (.kernelLineId | type == "string" and length > 0) and
            (.kernelVersion | type == "string" and length > 0) and
            (.expectedKernel | type == "string" and length > 0) and
            (.artifactName | type == "string" and test("^immortalwrt-[A-Za-z0-9._-]+\\.(img\\.gz|tar\\.gz|vmdk|qcow2)$")) and
            (.imageGlob | type == "string" and length > 0) and
            (.modes | type == "array") and
            (.files | type == "array") and
            ([.files[] | (.path | type == "string" and startswith("files/") and (contains("..") | not)) and
              (.content | type == "string") and
              (.mode | type == "number")] | all)
          ' plan.json > /dev/null; then
            fail prepare "" "" "" "Invalid source-build recipe payload."
          fi

          source_repo=$(jq -r .source.repo plan.json)
          source_ref=$(jq -r .source.ref plan.json)
          source_key=$(jq -r .cacheKey plan.json)
          config_hash=$(jq -r .config plan.json | sha256sum | cut -c1-16)
          {
            echo "SOURCE_REPO=$source_repo"
            echo "SOURCE_REF=$source_ref"
            echo "SOURCE_BRANCH=$(jq -r .source.branch plan.json)"
            echo "SOURCE_KEY=$source_key"
            echo "KERNEL_LINE=$(jq -r .kernelLineId plan.json)"
            echo "KERNEL_VERSION=$(jq -r .kernelVersion plan.json)"
            echo "EXPECTED_KERNEL=$(jq -r .expectedKernel plan.json)"
            echo "KERNEL_VERSION_FILE=$(jq -r .kernelVersionFile plan.json)"
            echo "ARTIFACT_NAME=$(jq -r .artifactName plan.json)"
            echo "IMAGE_GLOB=$(jq -r .imageGlob plan.json)"
            echo "CONFIG_HASH=$config_hash"
            echo "DL_CACHE_KEY=source-build-dl-${source_key}-${source_ref:0:12}"
            echo "STAGING_CACHE_KEY=source-build-staging-v2-${source_key}-${source_ref:0:12}-${config_hash}"
          } >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /opt/az /opt/microsoft /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          if ! sudo apt-get update -qq; then
            fail tools "" "" "" "apt-get update failed."
          fi
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential autoconf automake bc bison ccache cpio file flex gawk genisoimage gettext git \
            jq libelf-dev libncurses-dev libssl-dev libtool patch pkg-config python3 python3-setuptools \
            rsync squashfs-tools subversion swig time unzip wget xsltproc zlib1g-dev zstd e2fsprogs qemu-utils; then
            fail tools "" "" "" "Installing source-build dependencies failed."
          fi

      - name: Check out pinned ImmortalWrt source
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          rm -rf source
          mkdir source
          cd source
          git init -q
          git remote add origin "$SOURCE_REPO"
          if ! git fetch --depth 1 origin "$SOURCE_REF"; then
            echo "shallow fetch by commit failed; fetching branch ${SOURCE_BRANCH} instead" >&2
            if ! git fetch origin "$SOURCE_BRANCH"; then
              fail source "" "$SOURCE_REF" "" "Could not fetch pinned source ${SOURCE_REF}."
            fi
          fi
          if ! git checkout -q "$SOURCE_REF" 2>/dev/null; then
            git checkout -q FETCH_HEAD
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$SOURCE_REF" ]; then
            fail source "" "$SOURCE_REF" "" "Checked out ${actual} instead of pinned ${SOURCE_REF}."
          fi
          patchver=$(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/x86/Makefile | head -1)
          if [ "$patchver" != "$KERNEL_VERSION" ]; then
            fail source "" "$SOURCE_REF" "$KERNEL_VERSION" "target/linux/x86/Makefile wants kernel ${patchver}, recipe says ${KERNEL_VERSION}."
          fi
          expected_prefix="${EXPECTED_KERNEL%.*}"
          expected_patch="${EXPECTED_KERNEL##*.}"
          if [ ! -f "$KERNEL_VERSION_FILE" ]; then
            fail source "" "$SOURCE_REF" "$EXPECTED_KERNEL" "Kernel version file ${KERNEL_VERSION_FILE} is missing."
          fi
          if ! grep -Eq "LINUX_VERSION-${expected_prefix//./\\.} = \\.${expected_patch}$" "$KERNEL_VERSION_FILE"; then
            fail source "" "$SOURCE_REF" "$EXPECTED_KERNEL" "${KERNEL_VERSION_FILE} does not pin kernel ${EXPECTED_KERNEL}."
          fi

      - name: Write generated files overlay
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          # Ticket 05: the inline cases moved into the rule shared with
          # build.yml, so the two engines cannot drift apart.
          source .github/scripts/check-files.sh
          cd source
          rm -rf files
          count=$(jq '.files | length' "$GITHUB_WORKSPACE/plan.json")
          echo "generated files in plan: $count"
          jq -c '.files[]' "$GITHUB_WORKSPACE/plan.json" | while IFS= read -r file; do
            path=$(echo "$file" | jq -r .path)
            mode=$(echo "$file" | jq -r '.mode // 420')
            check_generated_file "$path" "$mode" \
              || fail write-files "" "$SOURCE_REF" "" "unsafe generated file: $path (mode $mode)"
            mkdir -p "$(dirname "$path")"
            echo "$file" | jq -r .content > "$path"
            chmod "$(printf '%o' "$mode")" "$path"
          done
          # The project feed key is fetched, not carried in the plan (the plan
          # only pins its URL and sha256 fingerprint).
          if jq -e '.feedSet.key.url' "$GITHUB_WORKSPACE/plan.json" > /dev/null 2>&1; then
            key_url=$(jq -r '.feedSet.key.url' "$GITHUB_WORKSPACE/plan.json")
            key_sha=$(jq -r '.feedSet.key.fingerprint' "$GITHUB_WORKSPACE/plan.json")
            if [ -n "$key_url" ] && [ "$key_url" != "null" ] && [ -n "$key_sha" ] && [ "$key_sha" != "null" ]; then
              key_file=files/etc/apk/keys/combinewrt-feed.pub.pem
              mkdir -p files/etc/apk/keys
              if ! curl -fL --retry 3 --retry-delay 5 -o "$key_file" "$key_url"; then
                fail write-files "" "$SOURCE_REF" "" "failed to download the project feed key: $key_url"
              fi
              actual=$(sha256sum "$key_file" | cut -d' ' -f1)
              if [ "$actual" != "$key_sha" ]; then
                fail write-files "" "$SOURCE_REF" "" "project feed key sha256 does not match the plan: expected=$key_sha actual=$actual"
              fi
              echo "installed project feed key at files/etc/apk/keys/combinewrt-feed.pub.pem"
            fi
          fi
          find files -type f | sort
          echo "generated file contents are not printed (they carry the root password hash)"

      - name: Restore download cache
        id: dl-cache
        uses: actions/cache/restore@v6
        with:
          path: source/dl
          key: ${{ env.DL_CACHE_KEY }}
          restore-keys: |
            source-build-dl-${{ env.SOURCE_KEY }}-

      - name: Restore build staging cache
        id: staging-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            source/staging_dir/host
            source/staging_dir/toolchain-*
            source/build_dir/host
            source/build_dir/toolchain-*
          key: ${{ env.STAGING_CACHE_KEY }}
          restore-keys: |
            source-build-staging-${{ env.SOURCE_KEY }}-

      - name: Restore compiler cache
        id: ccache-cache
        uses: actions/cache/restore@v6
        with:
          path: source/.ccache
          key: source-build-ccache-${{ env.SOURCE_KEY }}-${{ env.CONFIG_HASH }}
          restore-keys: |
            source-build-ccache-${{ env.SOURCE_KEY }}-

      - name: Install pinned feeds
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          cd source
          jq -r .feedsConf "$GITHUB_WORKSPACE/plan.json" > feeds.conf
          if ! ./scripts/feeds update -a; then
            fail feeds "" "$SOURCE_REF" "" "scripts/feeds update -a failed."
          fi
          if ! ./scripts/feeds install -a; then
            fail feeds "" "$SOURCE_REF" "" "scripts/feeds install -a failed."
          fi

      - name: Apply generated config
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          cd source
          jq -r .config "$GITHUB_WORKSPACE/plan.json" > .config
          if ! make defconfig; then
            fail config "" "$SOURCE_REF" "" "make defconfig failed."
          fi
          echo "Target/profile symbols selected by make defconfig:"
          grep -E '^CONFIG_TARGET_(x86|MULTI_PROFILE|DEVICE_)' .config || true
          missing=$(jq -r '.configChecks[]' "$GITHUB_WORKSPACE/plan.json" | while IFS= read -r check; do
            grep -qxF "$check" .config || printf '%s\n' "$check"
          done)
          if [ -n "$missing" ]; then
            fail config "" "$SOURCE_REF" "" "Missing required symbols after make defconfig: $(printf '%s' "$missing" | tr '\n' ' ')"
          fi
          profile=""
          while IFS= read -r candidate; do
            if grep -qxF "$candidate" .config; then
              profile="$candidate"
              break
            fi
          done <<< "$(jq -r '.profileChecks[]' "$GITHUB_WORKSPACE/plan.json")"
          if [ -z "$profile" ]; then
            fail config "" "$SOURCE_REF" "" "None of the expected target-profile symbols are enabled; selected: $(grep -E '^CONFIG_TARGET_(MULTI_PROFILE|x86_64|DEVICE_)' .config | tr '\n' ' ')"
          fi
          echo "Selected target profile: $profile"
          echo "COMBINEWRT_PROFILE=$profile" >> "$GITHUB_ENV"

      - name: Download package sources
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          cd source
          if ! make -j"$(nproc)" download; then
            echo "parallel download failed; retrying serially" >&2
            if ! make -j1 V=s download; then
              fail download "" "$SOURCE_REF" "" "make download failed."
            fi
          fi

      - name: Save download cache
        if: steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: source/dl
          key: ${{ env.DL_CACHE_KEY }}

      - name: Build image
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          cd source
          start=$(date +%s)
          if ! make -j"$(( $(nproc) + 1 ))" 2>&1 | tee build.log; then
            tail -n 160 build.log || true
            fail build "" "$SOURCE_REF" "$KERNEL_LINE" "make failed; see build.log."
          fi
          echo "COMBINEWRT_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Save build staging cache
        if: success() && steps.staging-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            source/staging_dir/host
            source/staging_dir/toolchain-*
            source/build_dir/host
            source/build_dir/toolchain-*
          key: ${{ env.STAGING_CACHE_KEY }}
      - name: Save compiler cache
        if: success() && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: source/.ccache
          key: source-build-ccache-${{ env.SOURCE_KEY }}-${{ env.CONFIG_HASH }}

      - name: Package image and manifest
        env:
          DL_HIT: ${{ steps.dl-cache.outputs.cache-hit }}
          STAGING_HIT: ${{ steps.staging-cache.outputs.cache-hit }}
          CCACHE_HIT: ${{ steps.ccache-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          cd source
          image=$(find bin/targets -type f -name "$IMAGE_GLOB" | head -1)
          if [ -z "$image" ]; then
            fail package "" "$SOURCE_REF" "$KERNEL_LINE" "No image matched ${IMAGE_GLOB} in bin/targets."
          fi
          kernel_release=$(find build_dir -type f -name kernel.release | head -1)
          if [ -z "$kernel_release" ]; then
            fail package "" "$SOURCE_REF" "$KERNEL_LINE" "No kernel.release found under build_dir."
          fi
          built_kernel=$(cat "$kernel_release")
          if [ "$built_kernel" != "$EXPECTED_KERNEL" ]; then
            fail package "" "$SOURCE_REF" "$EXPECTED_KERNEL" "Built kernel ${built_kernel}, recipe expects ${EXPECTED_KERNEL}."
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          artifact="$GITHUB_WORKSPACE/out/$ARTIFACT_NAME"
          cp "$image" "$artifact"
          if ! gzip -t "$artifact" 2>"$RUNNER_TEMP/gzip.err"; then
            # Some x86 disk images carry padding after the gzip member. gzip
            # verifies the stream CRC and then only warns about that padding,
            # so accept exactly that case and reject any other damage.
            if grep -q "trailing garbage ignored" "$RUNNER_TEMP/gzip.err"; then
              echo "gzip: stream verified; padding after the gzip member ignored"
            else
              cat "$RUNNER_TEMP/gzip.err" >&2
              fail package "" "$SOURCE_REF" "$KERNEL_LINE" "gzip integrity check failed for ${ARTIFACT_NAME}."
            fi
          fi
          sha=$(sha256sum "$artifact" | awk '{print $1}')
          size=$(stat -c%s "$artifact")
          if [ "$size" -gt 2147483648 ]; then
            fail package "" "$SOURCE_REF" "$KERNEL_LINE" "Artifact is ${size} bytes, above the 2 GiB cap."
          fi
          jq -c -n \
            --arg artifact "$ARTIFACT_NAME" \
            --arg sha256 "$sha" \
            --argjson sizeBytes "$size" \
            --arg kernelLine "$KERNEL_LINE" \
            --arg kernelVersion "$built_kernel" \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceRef "$SOURCE_REF" \
            --arg sourceBranch "$SOURCE_BRANCH" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson downloadCache "${DL_HIT:-false}" \
            --argjson stagingCache "${STAGING_HIT:-false}" \
            --argjson ccacheCache "${CCACHE_HIT:-false}" \
            --arg buildSeconds "${COMBINEWRT_BUILD_SECONDS:-0}" \
            '{artifact:$artifact,sha256:$sha256,sizeBytes:$sizeBytes,kernelLine:$kernelLine,kernelVersion:$kernelVersion,source:{repo:$sourceRepo,ref:$sourceRef,branch:$sourceBranch},run:{id:$runId,url:$runUrl},cache:{download:$downloadCache,staging:$stagingCache,ccache:$ccacheCache},buildSeconds:($buildSeconds|tonumber)}' \
            > "$GITHUB_WORKSPACE/out/manifest.json"
          cat "$GITHUB_WORKSPACE/out/manifest.json"
          echo "COMBINEWRT_MANIFEST=$(cat "$GITHUB_WORKSPACE/out/manifest.json")"
          echo "COMBINEWRT_ARTIFACT_SHA256=$sha"
          echo "COMBINEWRT_ARTIFACT_SIZE=$size"

      - name: Verify generated files overlay in the image
        run: |
          set -euo pipefail
          source .github/scripts/fail.sh
          cd source
          plan="$GITHUB_WORKSPACE/plan.json"
          count=$(jq '.files | length' "$plan")
          if [ "$count" -eq 0 ]; then
            echo "plan carries no generated files; nothing to verify"
            exit 0
          fi
          image=$(find bin/targets -type f -name "$IMAGE_GLOB" | head -1)
          if [ -z "$image" ]; then
            fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "No image matched ${IMAGE_GLOB} for the files overlay check."
          fi
          ROOT=$(mktemp -d)
          WORK=$(mktemp -d)
          LOOP=""
          VAR_MOUNT=""
          cleanup() {
            set +e
            if [ -n "$VAR_MOUNT" ] && mountpoint -q "$VAR_MOUNT"; then sudo umount "$VAR_MOUNT"; fi
            if mountpoint -q "$ROOT"; then sudo umount "$ROOT"; fi
            if [ -n "$LOOP" ]; then sudo losetup -d "$LOOP"; fi
            rm -rf "$ROOT" "$WORK"
          }
          trap cleanup EXIT
          case "$image" in
            *.tar.gz)
              tar -xzf "$image" -C "$ROOT"
              ;;
            *)
              RAW="$WORK/image.img"
              # The x86 disk images carry padding after the gzip member, so gzip verifies
              # the stream CRC and exits 2 with only "trailing garbage ignored". That is
              # the same padding "Package image and manifest" already accepts; any other
              # gzip failure is real damage. Tolerating the warning here is required: with
              # set -e a bare `gzip -dc` aborts the step before any check runs.
              set +e
              gzip -dc "$image" > "$RAW" 2> "$WORK/gzip.err"
              gzip_status=$?
              set -e
              if [ "$gzip_status" -ne 0 ]; then
                if [ "$gzip_status" -eq 2 ] && grep -q "trailing garbage ignored" "$WORK/gzip.err"; then
                  echo "gzip: stream verified; padding after the gzip member ignored"
                else
                  cat "$WORK/gzip.err" >&2
                  fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "gzip could not decompress ${ARTIFACT_NAME} for the files overlay check"
                fi
              fi
              LOOP=$(sudo losetup -Pf --show "$RAW")
              MOUNTED=""
              for part in "$LOOP"p*; do
                if sudo mount -o rw "$part" "$ROOT" 2>/dev/null; then
                  if [ -d "$ROOT/etc" ]; then MOUNTED="$part"; break; fi
                  sudo umount "$ROOT"
                fi
                if sudo mount -t squashfs -o rw "$part" "$ROOT" 2>/dev/null; then
                  if [ -d "$ROOT/etc" ]; then MOUNTED="$part"; break; fi
                  sudo umount "$ROOT"
                fi
              done
              if [ -z "$MOUNTED" ]; then
                fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "could not mount any rootfs partition of ${ARTIFACT_NAME}"
              fi
              echo "rootfs partition: $MOUNTED"
              ;;
          esac
          # Every planned file must be inside the image with the mode the plan recorded.
          missing=0
          for ((i = 0; i < count; i++)); do
            rel=$(jq -r --argjson i "$i" '.files[$i].path | sub("^files/"; "")' "$plan")
            mode=$(jq -r --argjson i "$i" '.files[$i].mode // 420' "$plan")
            want=$(printf '%o' "$mode")
            if [ ! -e "$ROOT/$rel" ]; then
              echo "MISSING from the image: /$rel"
              missing=$((missing + 1))
              continue
            fi
            got=$(stat -c '%a' "$ROOT/$rel")
            if [ "$got" != "$want" ]; then
              echo "MODE MISMATCH in the image: /$rel is 0$got, the plan recorded 0$want"
              missing=$((missing + 1))
              continue
            fi
            echo "present in the image: /$rel (mode 0$got)"
          done
          if [ "$missing" -gt 0 ]; then
            fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "${missing} planned generated file(s) are missing from the image or have the wrong mode"
          fi
          # spec:42 Docker row: /var/lib/docker must exist and be writable after boot.
          # /var is a symlink to /tmp on the x86 images and first boot mounts a tmpfs
          # there, so the directory cannot be in the image: the docker uci-defaults creates
          # it at boot. Model that boot here instead of asserting on the mounted image.
          if jq -e '.modes | index("docker")' "$plan" > /dev/null; then
            uci_file="$ROOT/etc/uci-defaults/91-combinewrt-docker"
            if [ ! -f "$uci_file" ]; then
              fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "docker mode is selected but its uci-defaults file is not in the image"
            fi
            for needle in "mkdir -p /var/lib/docker" "chmod 0711 /var/lib/docker" "data_root='/var/lib/docker'"; do
              if ! sudo grep -qF "$needle" "$uci_file"; then
                fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "the docker uci-defaults in the image does not contain: ${needle}"
              fi
            done
            echo "docker uci-defaults ships the data-root setup: mkdir /var/lib/docker, mode 0711, dockerd data_root"
            if [ ! -f "$ROOT/etc/config/dockerd" ]; then
              fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "docker mode is selected but /etc/config/dockerd is not in the image"
            fi
            # /etc/config/dockerd is a 0600 root:root opkg conffile, so read it through sudo
            # (run 44294935617 failed only because a plain grep could not open it).
            echo "dockerd data_root before first boot: $(sudo sed -n "s/^[[:space:]]*option data_root '\(.*\)'/\1/p" "$ROOT/etc/config/dockerd" | head -1)"
            # Resolve /var inside the image (a symlink -> tmp today, possibly absolute),
            # then put a small tmpfs on the resolved directory: that is the /var the
            # uci-defaults sees at first boot.
            var_host="$ROOT/var"
            for _ in 1 2 3 4; do
              if [ -L "$var_host" ]; then
                target=$(readlink "$var_host")
                case "$target" in
                  /*) var_host="$ROOT$target" ;;
                  *) var_host="$(dirname "$var_host")/$target" ;;
                esac
              else
                break
              fi
            done
            case "$var_host" in
              "$ROOT"/*) ;;
              *) fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "the image's /var resolves outside the image root (${var_host#"$ROOT"})" ;;
            esac
            echo "image /var resolves to ${var_host#"$ROOT"} (mounted as tmpfs for the boot-equivalent check)"
            if [ ! -d "$var_host" ]; then sudo mkdir -p "$var_host"; fi
            sudo mount -t tmpfs -o size=16m,mode=1777 tmpfs "$var_host"
            VAR_MOUNT="$var_host"
            sudo chroot "$ROOT" /bin/sh /etc/uci-defaults/91-combinewrt-docker
            if [ ! -d "$var_host/lib/docker" ]; then
              fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "/var/lib/docker does not exist after the docker uci-defaults ran with a tmpfs /var"
            fi
            # test -w is always true for root; prove writability by creating and deleting
            # a file through the same chroot the boot would use.
            if ! sudo chroot "$ROOT" /bin/sh -c 'f=/var/lib/docker/.combinewrt-write-test; : > "$f" && rm -f "$f" && [ ! -e "$f" ]'; then
              fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "/var/lib/docker is not writable after the docker uci-defaults ran with a tmpfs /var"
            fi
            data_root=$(sudo chroot "$ROOT" /bin/sh -c '. /lib/functions.sh; config_load dockerd; config_get root globals data_root ""; echo "$root"')
            if [ "$data_root" != "/var/lib/docker" ]; then
              fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "dockerd data_root is '${data_root}', expected /var/lib/docker"
            fi
            if ! sudo grep -qF "option data_root '/var/lib/docker'" "$ROOT/etc/config/dockerd"; then
              fail verify-files "" "$SOURCE_REF" "$KERNEL_LINE" "/etc/config/dockerd does not carry data_root /var/lib/docker after the docker uci-defaults ran"
            fi
            echo "docker data root verified at first boot: /var/lib/docker exists on the tmpfs-backed /var, is writable, and dockerd data_root matches"
          fi
          echo "generated files overlay verified in the image"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/${{ env.ARTIFACT_NAME }}
            out/manifest.json
          retention-days: 7
          if-no-files-found: error

